name: Publish Python package to PyPI (on tag)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine tomli

      - name: Remove previous dist
        run: rm -rf dist

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Read package version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          try:
              import tomllib
          except ModuleNotFoundError:  # Python < 3.11
              import tomli as tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(f"PKG_VERSION={data['project']['version']}")
          PY

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*${{ env.PKG_VERSION }}*
