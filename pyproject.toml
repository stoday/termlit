[project]
name = "termlit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=4.0.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
]

[project.scripts]
termlit = "termlit.cli:main"

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
termlit = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "termlit",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
